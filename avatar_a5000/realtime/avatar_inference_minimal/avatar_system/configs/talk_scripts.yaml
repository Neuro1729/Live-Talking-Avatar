# Talking-bank scripts (pilot). Each clip = Sarvam TTS speech (shubh) with designed pauses/silences, generated by
# LTX-2.5 audio-to-video with start+end guide = home pose. Every part is labelled (speech act, emotion) so the
# gestures recorded with it can later be retrieved for new sentences with similar act/emotion/rhythm.
# parts: {say: text, lang} or {pause: seconds}. behavior = prompt variant (see behaviors below).
behaviors:
  gesture: "While speaking he makes small, natural, relaxed hand gestures on the important words, then rests his hands on the table again."
  expressive: "While speaking his face is expressive: his eyebrows lift slightly on important words and he nods gently, his hands stay resting on the table."
  calm: "He speaks calmly and steadily with gentle facial expressions and very small natural head movements, his hands stay resting on the table."
  warm: "He speaks warmly with a genuine friendly smile, his eyes crinkle slightly, small happy nods, one small open hand gesture."
  thinking: "During the pauses he looks thoughtful, his eyes move slightly as he considers, then he continues speaking calmly."
  listening: "Most of the time he is silently listening with attentive eyes and small acknowledging nods, and he says only a few short words."
clips:
  - name: talk_greet_s1
    behavior: expressive
    act: greeting
    emotion: warm
    parts:
      - {pause: 0.8}
      - {say: "नमस्ते! मैं आपका डिजिटल सहायक हूँ।", lang: hi-IN}
      - {pause: 0.5}
      - {say: "आप मुझसे सेहत, खाने-पीने या किसी भी चीज़ के बारे में पूछ सकते हैं।", lang: hi-IN}
      - {pause: 1.4}
  - name: talk_steps_s1
    behavior: gesture
    act: enumerate_steps
    emotion: neutral
    parts:
      - {pause: 0.6}
      - {say: "पहला, सुबह खाली पेट पानी पिएं।", lang: hi-IN}
      - {pause: 0.4}
      - {say: "दूसरा, रोज़ आधा घंटा टहलें।", lang: hi-IN}
      - {pause: 0.4}
      - {say: "और तीसरा, रात को जल्दी सो जाएँ।", lang: hi-IN}
      - {pause: 1.2}
  - name: talk_empathy_s1
    behavior: calm
    act: reassure
    emotion: empathetic
    parts:
      - {pause: 1.0}
      - {say: "मैं आपकी चिंता समझ सकता हूँ।", lang: hi-IN}
      - {pause: 0.7}
      - {say: "आप हिम्मत रखिए, सही इलाज से सब ठीक हो जाएगा।", lang: hi-IN}
      - {pause: 1.5}
  - name: talk_congrats_s1
    behavior: warm
    act: congratulate
    emotion: positive
    parts:
      - {pause: 0.6}
      - {say: "Arre wah, bahut bahut badhai ho!", lang: hi-IN}
      - {pause: 0.4}
      - {say: "Ye sunkar mujhe sach mein bahut khushi hui.", lang: hi-IN}
      - {pause: 1.4}
  - name: talk_advice_s1
    behavior: gesture
    act: advise_emphasis
    emotion: serious
    parts:
      - {pause: 0.6}
      - {say: "Blood sugar ke liye sabse zaroori hai ki aap meetha kam karein.", lang: hi-IN}
      - {pause: 0.5}
      - {say: "Aur doctor se regular checkup zaroor karwayein.", lang: hi-IN}
      - {pause: 1.3}
  - name: talk_explain_en_s1
    behavior: expressive
    act: explain
    emotion: neutral
    parts:
      - {pause: 0.7}
      - {say: "Sure, let me explain it simply.", lang: en-IN}
      - {pause: 0.5}
      - {say: "In summer, drink plenty of water and avoid going out in the afternoon sun.", lang: en-IN}
      - {pause: 1.3}
  - name: talk_think_s1
    behavior: thinking
    act: think_then_answer
    emotion: thoughtful
    parts:
      - {pause: 1.2}
      - {say: "हम्म, अच्छा सवाल है।", lang: hi-IN}
      - {pause: 1.0}
      - {say: "देखिए, यह आपकी उम्र और खाने की आदतों पर निर्भर करता है।", lang: hi-IN}
      - {pause: 1.4}
  - name: talk_listen_s1
    behavior: listening
    act: acknowledge
    emotion: attentive
    parts:
      - {pause: 2.5}
      - {say: "जी।", lang: hi-IN}
      - {pause: 2.0}
      - {say: "जी हाँ, समझ गया।", lang: hi-IN}
      - {pause: 2.6}
