  # excluded them. v2: 3.9 s clips leave the model less room to wander.
  - {name: gen_home2tilt_v2_s61, prompt_file: subtle_to_tilt.txt,   seed: 61, start: home, end: tilt, frames: 97}
  - {name: gen_home2tilt_v2_s62, prompt_file: subtle_to_tilt.txt,   seed: 62, start: home, end: tilt, frames: 97}
  - {name: gen_tilt2home_v2_s61, prompt_file: subtle_from_tilt.txt, seed: 61, start: tilt, end: home, frames: 97}
