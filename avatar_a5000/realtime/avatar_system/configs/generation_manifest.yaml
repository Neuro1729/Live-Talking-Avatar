# Clips to generate for graph gaps (validator 2026-10-30: state "tilt" (thoughtful head tilt) had no runtime segment).
# start/end = anchor names from data/anchors.json ("home" = avatar image). Prompts live in R/prompts/.
clips:
  - {name: gen_home2tilt_s51, prompt_file: subtle_to_tilt.txt,   seed: 51, start: home, end: tilt}
  - {name: gen_home2tilt_s52, prompt_file: subtle_to_tilt.txt,   seed: 52, start: home, end: tilt}
  - {name: gen_tilt2home_s51, prompt_file: subtle_from_tilt.txt, seed: 51, start: tilt, end: home}
  - {name: gen_tilt2home_s52, prompt_file: subtle_from_tilt.txt, seed: 52, start: tilt, end: home}
