behaviors:
  gesture: While speaking he makes small, natural, relaxed hand gestures on the important words, then rests his hands on the table again.
  expressive: 'While speaking his face is expressive: his eyebrows lift slightly on important words and he nods gently, his hands stay resting on the table.'
  calm: He speaks calmly and steadily with gentle facial expressions and very small natural head movements, his hands stay resting on the table.
  warm: He speaks warmly with a genuine friendly smile, his eyes crinkle slightly, small happy nods, one small open hand gesture.
  thinking: During the pauses he looks thoughtful, his eyes move slightly as he considers, then he continues speaking calmly.
  listening: Most of the time he is silently listening with attentive eyes and small acknowledging nods, and he says only a few short words.
